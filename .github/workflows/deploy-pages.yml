name: Deploy Elyra Suite Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: elyra-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build branded beauty guide PDF
        run: |
          if [ -s "assets/Elyra_Suite_Healthy_Makeup_Guide.pdf" ]; then
            echo "Using the checked-in Elyra Suite guide PDF."
          elif [ -f "assets/Elyra_Suite_Healthy_Makeup_Guide.b64" ]; then
            base64 --decode "assets/Elyra_Suite_Healthy_Makeup_Guide.b64" > "assets/Elyra_Suite_Healthy_Makeup_Guide.pdf"
          else
            echo "::error::The Elyra Suite guide PDF and its source are both missing."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
