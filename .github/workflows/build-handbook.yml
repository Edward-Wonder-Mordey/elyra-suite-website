name: Build Elyra Suite Owner Handbook

on:
  push:
    branches: [main]
    paths:
      - 'docs/.handbook-src-*.b64'
      - 'docs/generate_handbook.py'
      - '.github/workflows/build-handbook.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elyra-handbook
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tools
        run: python -m pip install --upgrade python-docx Pillow

      - name: Restore handbook generator
        shell: bash
        run: |
          shopt -s nullglob
          parts=(docs/.handbook-src-*.b64)
          if [ ${#parts[@]} -gt 0 ]; then
            cat "${parts[@]}" | base64 -d | gunzip > docs/generate_handbook.py
            rm -f docs/.handbook-src-*.b64
          fi
          test -f docs/generate_handbook.py

      - name: Build Word handbook
        run: python docs/generate_handbook.py

      - name: Commit handbook to repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          if git diff --cached --quiet; then
            echo 'Handbook is already up to date.'
          else
            git commit -m "Build Elyra Suite website owner's handbook"
            git push
          fi
